# Rebuilds the images the profile README shows from the `output` branch:
# the stats and languages cards (scripts/cards.mjs) and the contribution snake.
name: Profile images

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write # push to the output branch
  actions: write # keep this scheduled workflow enabled

concurrency:
  group: profile-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stats and languages cards
        run: node scripts/cards.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#007D9C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00ADD8

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile images
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, which is what stopped the old snake. Re-enabling resets that.
      - name: Keep the schedule enabled
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/profile.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
