<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" role="img" aria-labelledby="title">
  <title id="title">Azizbek Sobirov, Golang Backend Developer</title>
  <defs>
    <radialGradient id="glow" cx="790" cy="120" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ADD8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00ADD8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#8b949e" fill-opacity="0.35"/>
    </pattern>
    <linearGradient id="fade" x1="520" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotmask"><rect width="920" height="240" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="1" y="1" width="918" height="238" rx="16"/></clipPath>
  </defs>
  <style>
    .name { font: 700 60px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; letter-spacing: -1px; }
    .role { font: 500 30px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #00ADD8; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .rise { animation: rise .8s ease-out both; }
    .rise.late { animation-delay: .15s; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .rise { animation: none; }
      .packets { display: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="919" height="239" rx="16" fill="#161b22" stroke="#30363d"/>
  <g clip-path="url(#card)">
    <rect x="400" y="0" width="520" height="240" fill="url(#glow)"/>
    <rect x="400" y="0" width="520" height="240" fill="url(#dots)" mask="url(#dotmask)"/>
  </g>

  <g class="rise">
    <text class="name" x="54" y="118">Azizbek Sobirov</text>
  </g>
  <g class="rise late">
    <text class="role" x="58" y="170">Golang Backend Developer<tspan class="cursor" fill="#00ADD8">_</tspan></text>
  </g>

  <g fill="none" stroke="#00ADD8" stroke-width="1.5" stroke-opacity=".55">
      <path id="e1" d="M702 120 C 735 120, 740 66, 770 66"/>
      <path id="e2" d="M702 120 C 735 120, 740 174, 770 174"/>
      <path id="e3" d="M810 66 C 835 66, 838 104, 852 112"/>
      <path id="e4" d="M810 174 C 835 174, 838 136, 852 128"/>
  </g>
  <g class="packets">
    <circle r="3.5" fill="#00ADD8" opacity="0"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#00ADD8" opacity="0"><animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#00ADD8" opacity="0"><animateMotion dur="2.4s" begin="-0.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#00ADD8" opacity="0"><animateMotion dur="2.4s" begin="-1.8s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e4"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/></circle>
  </g>

  <g stroke="#00ADD8" stroke-width="1.5">
    <!-- gateway -->
    <rect x="658" y="98" width="44" height="44" rx="11" fill="#0d1117"/>
    <path d="M673 113 l-6 7 6 7 M687 113 l6 7 -6 7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- services -->
    <rect x="770" y="46" width="40" height="40" rx="10" fill="#0d1117"/>
    <path d="M780 59 h20 M780 66 h20 M780 73 h12" fill="none" stroke-linecap="round"/>
    <rect x="770" y="154" width="40" height="40" rx="10" fill="#0d1117"/>
    <path d="M780 167 h20 M780 174 h20 M780 181 h12" fill="none" stroke-linecap="round"/>
    <!-- data store -->
    <path d="M852 106 v28 c0 4.4 7.6 8 17 8 s17 -3.6 17 -8 v-28" fill="#0d1117"/>
    <ellipse cx="869" cy="106" rx="17" ry="7" fill="#0d1117"/>
    <path d="M852 120 c0 4.4 7.6 8 17 8 s17 -3.6 17 -8" fill="none"/>
  </g>
</svg>
